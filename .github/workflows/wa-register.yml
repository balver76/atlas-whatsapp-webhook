name: WhatsApp Phone Registration

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run? request_code | verify_code | register"
        required: true
        default: "request_code"
      code_method:
        description: "sms or voice (needed for request_code)"
        required: false
        default: "sms"
      code:
        description: "The 4-8 digit code you received (needed for verify_code)"
        required: false
        default: ""
      pin:
        description: "Your 6-digit PIN for /register (needed for register)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Run step
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          STEP: ${{ inputs.step }}
          CODE_METHOD: ${{ inputs.code_method }}
          CODE: ${{ inputs.code }}
          PIN: ${{ inputs.pin }}
        run: |
          set -euo pipefail

          if [ -z "${WA_TOKEN:-}" ]; then
            echo "Missing secret WA_TOKEN"
            exit 1
          fi

          if [ -z "${PHONE_NUMBER_ID:-}" ]; then
            echo "Missing secret PHONE_NUMBER_ID"
            exit 1
          fi

          echo "Running step: ${STEP}"

          if [ "${STEP}" = "request_code" ]; then
            if [ -z "${CODE_METHOD:-}" ]; then
              echo "Missing input code_method (sms|voice)"
              exit 1
            fi

            curl -sS -X POST "https://graph.facebook.com/v20.0/${PHONE_NUMBER_ID}/request_code" \
              -H "Authorization: Bearer ${WA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"code_method\":\"${CODE_METHOD}\",\"language\":\"en\"}" | jq .
            exit 0
          fi

          if [ "${STEP}" = "verify_code" ]; then
            if [ -z "${CODE:-}" ]; then
              echo "Missing input code"
              exit 1
            fi

            curl -sS -X POST "https://graph.facebook.com/v20.0/${PHONE_NUMBER_ID}/verify_code" \
              -H "Authorization: Bearer ${WA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"code\":\"${CODE}\"}" | jq .
            exit 0
          fi

          if [ "${STEP}" = "register" ]; then
            if [ -z "${PIN:-}" ]; then
              echo "Missing input pin (6 digits)"
              exit 1
            fi

            curl -sS -X POST "https://graph.facebook.com/v20.0/${PHONE_NUMBER_ID}/register" \
              -H "Authorization: Bearer ${WA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"messaging_product\":\"whatsapp\",\"pin\":\"${PIN}\"}" | jq .
            exit 0
          fi

          echo "Unknown step. Use request_code | verify_code | register"
          exit 1
