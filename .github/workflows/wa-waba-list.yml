name: WhatsApp List WABAs

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: List owned WhatsApp Business Accounts
        shell: bash
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
        run: |
          set -euo pipefail
          BUSINESS_ID="1573867183545650"
          curl -sS "https://graph.facebook.com/v20.0/${BUSINESS_ID}/owned_whatsapp_business_accounts" \
            -H "Authorization: Bearer ${WA_TOKEN}"
